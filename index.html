<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Ular</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Game Ular</h1>

    <div id="info">
        <span>Skor: <strong id="skor">0</strong></span>
        <span id="status">Siap</span>
    </div>

    <canvas id="papan"></canvas>

    <div id="kontrol">
        <button id="startBtn" type="button">Mulai</button>
        <button id="pauseBtn" type="button">Jeda</button>
        <button id="restartBtn" type="button">Mulai Ulang</button>
    </div>

    <p id="petunjuk">Gerak: W S A D</p>
    
    <script src="script.js"></script>
</body>
</html>
